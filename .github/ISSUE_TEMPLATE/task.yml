name: Tâche technique
description: Chantier technique, infrastructure, outillage ou documentation
title: "chore: "
labels: ["type:chore"]
body:
  - type: textarea
    id: objectif
    attributes:
      label: Objectif
    validations:
      required: true
  - type: textarea
    id: dod
    attributes:
      label: Définition de terminé
      value: |
        - [ ] 
        - [ ] 
    validations:
      required: true
  - type: dropdown
    id: workstream
    attributes:
      label: Workstream
      options: [DevOps, Backend, Frontend, Design, QA]
    validations:
      required: true
  - type: dropdown
    id: nature
    attributes:
      label: Nature
      description: Qui traitera le ticket. « projet » part dans un run de jalon ; « outillage » (scripts/, .claude/) attend une session humaine dédiée.
      options: ["projet — produit MVP", "outillage — dispositif de collaboration"]
    validations:
      required: true
