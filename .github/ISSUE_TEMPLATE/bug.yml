name: Bug
description: Un comportement incorrect
title: "fix: "
labels: ["type:bug"]
body:
  - type: textarea
    id: attendu
    attributes:
      label: Comportement attendu vs observé
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Étapes de reproduction
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: dropdown
    id: env
    attributes:
      label: Environnement
      options: [local, dev, staging, production]
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Gravité
      options:
        - "P0 — bloquant (production indisponible, double réservation, fuite de données)"
        - "P1 — majeur (fonctionnalité MVP inutilisable)"
        - "P2 — mineur"
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: Module métier
      options: [identity, catalog, availability, appointments, crm, payments, notifications, reporting, infra]
    validations:
      required: true
  - type: dropdown
    id: nature
    attributes:
      label: Nature
      description: Qui traitera le ticket. « projet » part dans un run de jalon ; « outillage » (scripts/, .claude/) attend une session humaine dédiée.
      options: ["projet — produit MVP", "outillage — dispositif de collaboration"]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs, traces, captures
      description: Ne collez aucun secret, jeton, ni donnée personnelle client.
