name: Commitlint

on:
  pull_request:
    branches: [develop, staging, main]
    # `edited` est indispensable : la dernière étape valide le **titre** de la
    # PR, et c'est ce titre qui devient le message du commit de merge en squash.
    # Sans ce type, un titre corrigé n'est jamais revalidé — il partait donc sur
    # develop sans être vu.
    types: [opened, edited, synchronize, reopened]

jobs:
  commitlint:
    name: Messages de commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save @commitlint/cli @commitlint/config-conventional
      - name: Valider les commits de la PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
      # Le titre est du texte écrit par un humain : l'interpoler directement
      # dans le `run:` exécuterait ce qu'il contient. Il passe donc par
      # l'environnement, où il reste une donnée. Même motif que pr-governance.yml.
      - name: Valider le titre de la PR
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx commitlint --verbose
