name: Security scan

on:
  pull_request:
    branches: [develop, staging, main]
  push:
    branches: [develop]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Fuite de secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Le CLI gitleaks (MIT) plutôt que gitleaks-action, qui exige une licence
      # payante pour les dépôts d'organisation.
      - name: gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --redact --verbose --no-banner

  aws-static-keys:
    name: Aucune clé AWS statique
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Les workflows s'authentifient auprès d'AWS par OIDC (issue #14,
      # infra/terraform/modules/oidc) : un jeton signé, valable quelques minutes,
      # que rien ne stocke. Réintroduire une clé d'accès statique annulerait le
      # bénéfice sans que personne ne s'en aperçoive — gitleaks ne voit que les
      # valeurs, pas les références à un secret de dépôt.
      #
      # Les motifs sont assemblés par alternation plutôt qu'écrits en toutes
      # lettres : sinon ce fichier se détecterait lui-même à chaque exécution.
      - name: Aucune référence à une clé d'accès AWS
        run: |
          set -uo pipefail
          patterns='AWS_(ACCESS_KEY_ID|SECRET_ACCESS_KEY)|aws-(access-key-id|secret-access-key)|secrets\.AWS_'
          if grep -rnE "$patterns" .github/workflows; then
            echo "::error::Identifiant AWS statique référencé dans un workflow. Les rôles OIDC passent par des variables de dépôt (vars.AWS_*) — voir infra/terraform/modules/oidc/README.md."
            exit 1
          fi
          echo "Aucune clé AWS statique référencée dans .github/workflows."

  dependencies:
    name: Vulnérabilités des dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          skip-dirs: docs/specs

  iac:
    name: Terraform (tfsec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # hashFiles n'est pas évaluable au niveau du job : le test se fait ici,
      # après le checkout.
      - id: tf
        run: |
          if compgen -G "infra/terraform/**/*.tf" > /dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Aucun fichier Terraform pour l'instant — analyse ignorée."
          fi
      - uses: aquasecurity/tfsec-action@v1.0.3
        if: steps.tf.outputs.present == 'true'
        with:
          working_directory: infra/terraform

  codeql:
    name: CodeQL
    # Le code scanning n'est pas disponible sur un dépôt privé en plan Free.
    # Activer en posant la variable de dépôt ENABLE_CODEQL à 'true' après une
    # montée de plan, ou si le dépôt devient public.
    if: ${{ vars.ENABLE_CODEQL == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
