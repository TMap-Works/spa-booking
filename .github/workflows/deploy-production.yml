name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write   # OIDC — aucune clé AWS statique

env:
  # Nom posé par infra/terraform/modules/ecs-service/cluster.tf : le cluster
  # s'appelle `${local.name_prefix}-cluster`, suffixe compris — le préfixe
  # d'environnement seul ne désigne aucune ressource. La politique du rôle OIDC
  # (modules/oidc) cible ce nom-là et lui seul : s'en écarter donne un
  # AccessDenied qui accuse les droits au lieu du nom. Posé une seule fois ici,
  # comme dans deploy-dev.yml, et lu aussi bien par le job `deploy` que par
  # `rollback-on-failure`.
  CLUSTER: spa-prod-cluster

jobs:
  # La barrière du parcours critique, avant toute mise en production (#80,
  # troisième critère).
  #
  # ## Pourquoi ici, alors que `ci.yml` le joue déjà sur les pull requests
  #
  # Parce que rien ne garantit qu'une pull request soit passée par là. Ce
  # workflow se déclenche aussi sur `workflow_dispatch`, et une PR vers `main`
  # peut être rejouée, forcée ou mergée depuis un état que la CI n'a pas revu.
  # Surtout, le déploiement embarque `${{ github.sha }}` — l'état de `main` au
  # moment du push, qui n'est pas nécessairement celui qu'un check de PR a vu.
  # Éprouver l'état réellement déployé est le seul contrôle qui vaille.
  #
  # Il précède la prise de rôle AWS, le snapshot RDS et les migrations : un
  # parcours rouge n'aura donc coûté ni instantané, ni image poussée, ni
  # migration appliquée.
  e2e:
    name: Parcours critique
    uses: ./.github/workflows/e2e.yml
    secrets: inherit

  deploy:
    name: Déployer en production
    needs: e2e
    runs-on: ubuntu-latest
    # Tant que le rôle OIDC n'est pas appliqué (infra/terraform/modules/oidc), le
    # déploiement est ignoré proprement plutôt que de faire échouer chaque push.
    # Poser les variables de dépôt AWS_REGION et AWS_DEPLOY_ROLE_ARN active les
    # déploiements. Ce sont des `vars` et non des `secrets` : un ARN de rôle n'est
    # pas un secret, et le tenir hors des secrets rend visible qu'aucun identifiant
    # AWS n'y est stocké.
    if: ${{ vars.AWS_REGION != '' && vars.AWS_DEPLOY_ROLE_ARN != '' }}
    environment: prod   # approbation manuelle requise
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Le sujet OIDC présenté ici est `repo:<dépôt>:environment:prod`. La politique
      # de confiance n'accepte pas `ref:refs/heads/main` : la production ne passe
      # que par cet environnement, dont l'approbation manuelle serait sinon
      # contournable par un job sans bloc `environment:`.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-deploy-prod-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Snapshot RDS avant déploiement
        run: |
          aws rds create-db-snapshot \
            --db-instance-identifier spa-prod-rds \
            --db-snapshot-identifier "spa-prod-predeploy-$(date +%Y%m%d%H%M%S)"

      - name: Construire et pousser les images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/spa-prod-api:$TAG -f apps/api/Dockerfile .
          docker build -t $REGISTRY/spa-prod-web:$TAG -f apps/web/Dockerfile .
          docker push $REGISTRY/spa-prod-api:$TAG
          docker push $REGISTRY/spa-prod-web:$TAG

      # Nom du cluster seulement — les autres défauts de l'étape (`run-task` n'a
      # pas d'option `--wait` ; la configuration réseau recopiée à la main dans
      # une variable de dépôt) relèvent de #204, qui les traite le jour où
      # `envs/prod` composera le module `ecs-service`.
      - name: Appliquer les migrations de base de données
        run: |
          aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition spa-prod-migrate \
            --launch-type FARGATE \
            --network-configuration "${{ vars.ECS_NETWORK_CONFIG }}" \
            --wait

      - name: Déployer les services ECS
        run: |
          aws ecs update-service --cluster "$CLUSTER" --service spa-prod-api --force-new-deployment
          aws ecs update-service --cluster "$CLUSTER" --service spa-prod-web --force-new-deployment
          aws ecs wait services-stable --cluster "$CLUSTER" --services spa-prod-api spa-prod-web

      - name: Vérification de santé
        run: curl --fail --retry 10 --retry-delay 15 ${{ vars.APP_URL }}/health

      - name: Étiqueter la version déployée
        run: |
          git tag "deploy-prod-$(date +%Y%m%d-%H%M%S)" ${{ github.sha }}
          git push --tags

  rollback-on-failure:
    name: Rollback
    needs: deploy
    # `needs.deploy.result == 'failure'` et non `failure()` : depuis que le
    # parcours critique précède le déploiement, `failure()` serait vrai *aussi*
    # quand c'est le parcours qui rougit — cas où `deploy` est sauté et où rien
    # n'a été mis en production. Le rollback repartirait alors sur la
    # `deployments[1]` d'un service que personne n'a touché, et **défairait le
    # déploiement précédent**, qui était sain. La condition nomme donc
    # exactement ce qu'elle répare : un déploiement qui a échoué.
    #
    # `always() &&` n'est pas décoratif : une condition `if` qui ne porte
    # **aucune** fonction d'état se voit appliquer `success()` d'office par
    # GitHub. Sans lui, `needs.deploy.result == 'failure'` serait évalué comme
    # `success() && …` — donc faux précisément quand `deploy` a échoué, et le
    # rollback ne s'exécuterait jamais.
    if: always() && needs.deploy.result == 'failure'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-rollback-prod-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Revenir à la définition de tâche précédente
        run: |
          for svc in api web; do
            prev=$(aws ecs describe-services --cluster "$CLUSTER" --services spa-prod-$svc \
              --query 'services[0].deployments[1].taskDefinition' --output text)
            if [ "$prev" != "None" ] && [ -n "$prev" ]; then
              aws ecs update-service --cluster "$CLUSTER" --service spa-prod-$svc --task-definition "$prev"
            fi
          done
          aws ecs wait services-stable --cluster "$CLUSTER" --services spa-prod-api spa-prod-web
