name: CI

on:
  pull_request:
    branches: [develop, staging, main]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.12'

jobs:
  lint:
    name: Lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    # Pourquoi le service `postgres` reste, alors qu'aucun test ne s'en sert (#274).
    #
    # Les suites qui exigent un vrai moteur démarrent le leur depuis #274
    # (`@testcontainers/postgresql`, apps/api/test/utils/disposable-database.ts) :
    # elles ne lisent plus `DATABASE_URL` du tout. Le service ne sert donc plus
    # qu'à l'étape `db:migrate:deploy` ci-dessous — et cette étape-là, elle, ne
    # se remplace pas. Le harnais applique le SQL des migrations sans passer par
    # la CLI Prisma, délibérément (#139) ; c'est pourtant `prisma migrate deploy`
    # que la tâche ECS `spa-*-migrate` exécute au déploiement (deploy-*.yml).
    # Sans cette étape, plus rien ne prouverait que la CLI s'applique sur une
    # base vide, et la panne se découvrirait en production.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: spa
          POSTGRES_PASSWORD: spa
          POSTGRES_DB: spa_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U spa"
          --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      DATABASE_URL: postgresql://spa:spa@localhost:5432/spa_test
      REDIS_URL: redis://localhost:6379
      # Le réapeur de Testcontainers n'a rien à réclamer sur un runner jetable :
      # la machine entière disparaît à la fin du job. Le désactiver épargne un
      # tirage d'image et un démarrage de conteneur **à l'intérieur** du premier
      # `beforeAll`, dont le délai est celui de Jest (30 s). Les conteneurs sont
      # arrêtés explicitement par `drop()`, jamais laissés au réapeur.
      TESTCONTAINERS_RYUK_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run db:migrate:deploy

      # L'image du moteur est tirée ici, et non dans le `beforeAll` de la
      # première suite qui en démarre un : le tirage se compte sinon dans le
      # délai de Jest, et c'est un délai de test qui rougirait pour un temps de
      # réseau.
      #
      # La balise est **lue** dans `apps/api/test/utils/disposable-database.ts`
      # plutôt que recopiée ici : recopiée, elle dérive au premier changement de
      # `POSTGRES_IMAGE`, cette étape préchauffe alors une image que personne ne
      # démarre, et le tirage retombe dans le `beforeAll` — où il se lit comme un
      # test qui expire, pas comme un temps de réseau.
      - name: Image du moteur de test
        run: |
          image="$(sed -n "s/^const POSTGRES_IMAGE = '\(.*\)';$/\1/p" apps/api/test/utils/disposable-database.ts)"
          if [ -z "$image" ]; then
            echo "::error file=apps/api/test/utils/disposable-database.ts::POSTGRES_IMAGE est introuvable : l'étape de préchauffe ne sait plus quelle image tirer, et le tirage retomberait dans le délai de Jest."
            exit 1
          fi
          echo "Préchauffe de $image."
          docker pull "$image"

      - run: npm run test:unit

      # Contrat des cibles de test, tenu par une garde et non par un commentaire
      # (#274). Les deux étapes suivantes appellent les cibles **feuilles**, pas
      # l'alias `test:integration` : celui-ci enchaîne les deux, et les
      # rejouerait donc. Deux chemins d'exécution pour un même contrat, donc
      # quatre façons de perdre une suite en silence — que cette garde refuse :
      #
      # - un workspace qui déclarerait `test:integration` sans aucune feuille
      #   serait sauté **ici** par `--if-present`, sans une ligne dans le log ;
      # - un workspace qui déclarerait des feuilles sans l'alias serait sauté par
      #   `npm run verify`, qui ne connaît que l'alias ;
      # - un alias `test:integration` qui oublierait l'une de ses feuilles
      #   sauterait celle-ci dans `npm run verify`, en local et avant la CI ;
      # - et plus personne ne déclarant ni alias ni feuille, les deux étapes
      #   d'intégration ci-dessous ne lanceraient plus rien tout en restant
      #   vertes — c'est la garde elle-même qui deviendrait vide.
      #
      # `npm pkg get` lit les manifestes, pas le disque : aucune installation
      # n'est nécessaire, et la garde vaut pour tout workspace à venir.
      - name: Contrat des cibles de test d'intégration
        run: |
          npm pkg get scripts --workspaces --json > workspace-scripts.json
          cat > check-test-targets.cjs <<'JS'
          const { readFileSync } = require('node:fs');

          const ALIAS = 'test:integration';
          const LEAVES = ['test:integration:api', 'test:isolation'];

          const workspaces = JSON.parse(readFileSync('workspace-scripts.json', 'utf8'));
          const problems = [];
          let covered = 0;

          for (const [name, scripts] of Object.entries(workspaces)) {
            const declared = scripts ?? {};
            const alias = declared[ALIAS];
            const leaves = LEAVES.filter((leaf) => declared[leaf] !== undefined);

            if (alias === undefined && leaves.length === 0) {
              continue;
            }
            covered += 1;

            if (alias === undefined) {
              problems.push(
                `${name} declare « ${leaves.join(' », « ')} » sans l'alias « ${ALIAS} » : ` +
                  '`npm run verify` ne connait que l\'alias, ces cibles y seraient sautees en silence.',
              );
              continue;
            }

            if (leaves.length === 0) {
              problems.push(
                `${name} declare « ${ALIAS} » sans aucune de ses feuilles (${LEAVES.join(', ')}) : ` +
                  "le job `test` de ci.yml appelle les feuilles, ce workspace y serait saute en silence.",
              );
              continue;
            }

            for (const leaf of leaves) {
              if (!alias.includes(leaf)) {
                problems.push(
                  `${name} declare « ${leaf} » mais son alias « ${ALIAS} » ne l'appelle pas : ` +
                    '`npm run verify` passe par l\'alias, cette cible y serait sautee en silence.',
                );
              }
            }
          }

          // Sans ce dernier controle, la garde passerait au vert en n'ayant rien
          // regarde — manifestes vides, glob de workspaces qui ne resout plus,
          // ou format de `npm pkg get` qui change. Une garde vide contre les
          // suites sautees en silence serait elle-meme une suite sautee en silence.
          if (covered === 0) {
            problems.push(
              `aucun workspace ne declare « ${ALIAS} » ni aucune de ses feuilles (${LEAVES.join(', ')}) : ` +
                "les deux etapes d'integration de ci.yml ne lancent plus rien, et cette garde ne verifie plus rien.",
            );
          }

          if (problems.length > 0) {
            for (const problem of problems) {
              console.log(`::error file=package.json::${problem}`);
            }
            process.exit(1);
          }

          console.log(
            `Contrat des cibles de test respecte par ${covered} workspace(s) sur ` +
              `${Object.keys(workspaces).length} lu(s).`,
          );
          JS
          node check-test-targets.cjs
          rm -f workspace-scripts.json check-test-targets.cjs

      - name: Tests d'intégration
        run: npm run test:integration:api --workspaces --if-present

      # Les tests de fuite inter-tenant ont leur propre étape, et non un
      # sous-ensemble noyé dans la précédente : quand cette ligne rougit, elle
      # nomme une traversée d'établissement, pas « un test d'intégration ». Ils
      # sont exécutés par `npm run test:integration` en local — la cible
      # `test:integration` d'`apps/api` enchaîne les deux — d'où l'appel aux deux
      # feuilles ici, qui évite de les rejouer deux fois.
      #
      # Le harnais partagé qu'ils utilisent est décrit dans apps/api/README.md.
      # Il n'exige que le démon Docker du runner : chaque fichier de test démarre
      # son propre PostgreSQL 16, s'y crée une base jetable par suite, migrée
      # puis détruite, et arrête le conteneur derrière lui (#274).
      - name: Tests d'isolation inter-tenant
        run: npm run test:isolation --workspaces --if-present

      # Le moteur de réservation est le risque n°1 du projet (CDC §6) :
      # les tests de concurrence ne sont jamais optionnels.
      - name: Tests de concurrence (anti-double-réservation)
        run: npm run test:concurrency

  # L'outillage de `scripts/` n'est couvert par aucun test JS : `npm run verify`
  # ne parcourt que les workspaces. Or `pr_gate.py` est la barrière de merge du
  # dépôt — une régression sur son verdict remergerait des PR de paiement ou
  # d'infrastructure sans que rien ne rougisse. Voir #122.
  #
  # Sans filtre de chemin, délibérément : GitHub Actions ne sait filtrer qu'au
  # niveau du workflow, pas du job. Restreindre à `scripts/**` demanderait soit
  # un workflow séparé — qu'il faudrait alors ajouter à la liste `workflows:` de
  # auto-merge.yml, un oubli valant trou dans la barrière — soit une action
  # tierce. Le job dure quelques secondes et n'installe rien.
  scripts:
    name: Tests de l'outillage (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # `unittest` de la bibliothèque standard : aucune dépendance à installer,
      # donc rien à verrouiller ni à mettre à jour pour huit scripts d'outillage.
      - run: python -m unittest discover -s scripts/tests --verbose

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build

  # Les images sont construites ici et nulle part ailleurs avant `deploy-*.yml`.
  # Sans ce job, un Dockerfile cassé ne se découvre qu'au premier déploiement,
  # c'est-à-dire après le merge sur `develop` — donc sur une branche que rien ne
  # protège plus. Les images ne sont pas poussées : construire suffit à savoir si
  # elles se construisent, et le registre n'a pas à recevoir une image de PR.
  #
  # `npm run build` du job précédent ne le remplace pas : il compile sur le Node
  # du runner, avec les dépendances déjà installées et le contexte complet du
  # dépôt. Le build d'image, lui, éprouve ce que `.dockerignore` laisse passer,
  # l'ordre des `COPY`, et la capacité de l'image finale à démarrer sans les
  # dépendances de build.
  docker:
    name: Images Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Image API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          # `load` et non `push` : l'image reste sur le runner, le temps des
          # contrôles ci-dessous.
          load: true
          push: false
          tags: spa-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # Le critère « les images tournent en utilisateur non root » se vérifie sur
      # l'image construite, pas en relisant le Dockerfile : un `USER` posé avant
      # un `COPY --chown` manquant, ou effacé par une étape ultérieure, ne se voit
      # qu'à l'exécution.
      - name: L'image API ne tourne pas en root
        run: |
          uid="$(docker run --rm spa-api:ci id -u)"
          if [ "$uid" = "0" ]; then
            echo "::error file=apps/api/Dockerfile::L'image API démarre en root (uid 0). Vérifier la directive USER de l'étape runtime."
            exit 1
          fi
          echo "Image API : uid $uid, $(docker run --rm spa-api:ci id -un)."

      # Aucun compilateur ni CLI de test dans l'image d'exécution — c'est la
      # contrepartie des étapes séparées. `tsc` est le témoin retenu parce qu'il
      # revient tout seul : `@prisma/client` déclare `typescript` en pair
      # optionnel, et npm l'installe même sous `--omit=dev`.
      - name: L'image API ne contient pas de dépendances de build
        run: |
          if docker run --rm spa-api:ci sh -c 'test -e node_modules/.bin/tsc'; then
            echo "::error file=apps/api/Dockerfile::TypeScript est présent dans l'image d'exécution. Voir l'étape prod-deps."
            exit 1
          fi
          echo "Aucun compilateur TypeScript dans l'image API."

      # `apps/web` n'est pas encore initialisé : le workspace ne porte qu'un
      # `package.json` sans script, et `next build` n'a rien à compiler. Le
      # Dockerfile décrit la cible et se construira le jour où un `next.config.*`
      # apparaît — sans qu'il faille revenir modifier ce workflow.
      - id: web
        name: Le front est-il initialisé ?
        run: |
          if compgen -G "apps/web/next.config.*" > /dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice file=apps/web/Dockerfile::apps/web ne porte aucun next.config.* — build de l'image web ignoré tant que le front n'est pas posé."
          fi

      - name: Image web
        if: steps.web.outputs.present == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          load: true
          push: false
          tags: spa-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: L'image web ne tourne pas en root
        if: steps.web.outputs.present == 'true'
        run: |
          uid="$(docker run --rm spa-web:ci id -u)"
          if [ "$uid" = "0" ]; then
            echo "::error file=apps/web/Dockerfile::L'image web démarre en root (uid 0). Vérifier la directive USER de l'étape runtime."
            exit 1
          fi
          echo "Image web : uid $uid, $(docker run --rm spa-web:ci id -un)."
