name: CI

on:
  pull_request:
    branches: [develop, staging, main]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.12'

jobs:
  lint:
    name: Lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: spa
          POSTGRES_PASSWORD: spa
          POSTGRES_DB: spa_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U spa"
          --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      DATABASE_URL: postgresql://spa:spa@localhost:5432/spa_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run db:migrate:deploy
      - run: npm run test:unit
      - run: npm run test:integration
      # Le moteur de réservation est le risque n°1 du projet (CDC §6) :
      # les tests de concurrence ne sont jamais optionnels.
      - name: Tests de concurrence (anti-double-réservation)
        run: npm run test:concurrency

  # L'outillage de `scripts/` n'est couvert par aucun test JS : `npm run verify`
  # ne parcourt que les workspaces. Or `pr_gate.py` est la barrière de merge du
  # dépôt — une régression sur son verdict remergerait des PR de paiement ou
  # d'infrastructure sans que rien ne rougisse. Voir #122.
  #
  # Sans filtre de chemin, délibérément : GitHub Actions ne sait filtrer qu'au
  # niveau du workflow, pas du job. Restreindre à `scripts/**` demanderait soit
  # un workflow séparé — qu'il faudrait alors ajouter à la liste `workflows:` de
  # auto-merge.yml, un oubli valant trou dans la barrière — soit une action
  # tierce. Le job dure quelques secondes et n'installe rien.
  scripts:
    name: Tests de l'outillage (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # `unittest` de la bibliothèque standard : aucune dépendance à installer,
      # donc rien à verrouiller ni à mettre à jour pour huit scripts d'outillage.
      - run: python -m unittest discover -s scripts/tests --verbose

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
