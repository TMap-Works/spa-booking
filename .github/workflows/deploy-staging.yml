name: Deploy Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # OIDC — aucune clé AWS statique

env:
  # Nom posé par infra/terraform/modules/ecs-service/cluster.tf : le cluster
  # s'appelle `${local.name_prefix}-cluster`, suffixe compris — le préfixe
  # d'environnement seul ne désigne aucune ressource. La politique du rôle OIDC
  # (modules/oidc) cible ce nom-là et lui seul : s'en écarter donne un
  # AccessDenied qui accuse les droits au lieu du nom. Posé une seule fois ici,
  # comme dans deploy-dev.yml.
  CLUSTER: spa-staging-cluster

jobs:
  deploy:
    name: Déployer sur staging
    runs-on: ubuntu-latest
    # Tant que le rôle OIDC n'est pas appliqué (infra/terraform/modules/oidc), le
    # déploiement est ignoré proprement plutôt que de faire échouer chaque push.
    # Poser les variables de dépôt AWS_REGION et AWS_DEPLOY_ROLE_ARN active les
    # déploiements. Ce sont des `vars` et non des `secrets` : un ARN de rôle n'est
    # pas un secret, et le tenir hors des secrets rend visible qu'aucun identifiant
    # AWS n'y est stocké.
    if: ${{ vars.AWS_REGION != '' && vars.AWS_DEPLOY_ROLE_ARN != '' }}
    environment: staging
    steps:
      - uses: actions/checkout@v4

      # Le sujet OIDC présenté ici est `repo:<dépôt>:environment:staging`, parce que
      # le job déclare `environment:`. C'est cette forme que la politique de
      # confiance du rôle attend — pas la branche.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-deploy-staging-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Construire et pousser les images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/spa-staging-api:$TAG -f apps/api/Dockerfile .
          docker build -t $REGISTRY/spa-staging-web:$TAG -f apps/web/Dockerfile .
          docker push $REGISTRY/spa-staging-api:$TAG
          docker push $REGISTRY/spa-staging-web:$TAG

      # Nom du cluster et remise en forme seulement — les retours à la ligne de
      # cette commande avaient disparu. Les autres défauts de l'étape (`run-task`
      # n'a pas d'option `--wait` ; la configuration réseau recopiée à la main
      # dans une variable de dépôt) relèvent de #204, qui les traite le jour où
      # `envs/staging` composera le module `ecs-service`.
      - name: Appliquer les migrations de base de données
        run: |
          aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition spa-staging-migrate \
            --launch-type FARGATE \
            --network-configuration "${{ vars.ECS_NETWORK_CONFIG }}" \
            --wait

      - name: Déployer les services ECS
        run: |
          aws ecs update-service --cluster "$CLUSTER" --service spa-staging-api --force-new-deployment
          aws ecs update-service --cluster "$CLUSTER" --service spa-staging-web --force-new-deployment
          aws ecs wait services-stable --cluster "$CLUSTER" --services spa-staging-api spa-staging-web

      - name: Vérification de santé
        run: curl --fail --retry 5 --retry-delay 10 ${{ vars.APP_URL }}/health
